# Feature SDK pubspecs point at ../base (the composed-app cache layout).
# When paas_customer itself is the resolution root against sibling repos,
# this override redirects base_sdk to its real workspace location.
# Version arbitration across the composed SDK set (kernel pins an older
# ecosystem than the newest SDKs; root overrides win globally).
#
# Machine-local overrides (e.g. the Windows-dev copies of the firebase
# packages under .rokct/win_dev_overrides/ with the `windows:` platform
# stripped) must NOT live here: this file is what CI resolves, and a path
# that only exists on one dev machine breaks `pub get` everywhere else.
# Put them in pubspec_overrides.yaml instead - `dart pub` merges it over
# this section automatically, and it is gitignored.
dependency_overrides:
  # drift must stay on a release whose sqlite3 constraint admits the pinned
  # sqlite3 2.9.4 below (2.34.x moved to sqlite3 ^3.x and fails to compile
  # against it — surfaced on the first real Windows build).
  drift: 2.31.0
  # Firebase pinned exactly: with pubspec.lock untracked, pub get drifted
  # firebase_core to 3.15.x, whose bundled Firebase C++ SDK needs MSVC
  # runtime symbols (VS 2022 17.4+ STL) this machine's toolset lacks —
  # every Windows link then fails with LNK2019 __std_find_end_1 /
  # _Cnd_timedwait_for_unchecked in firebase_firestore.lib. firebase_auth
  # is at 5.4.0 (minimum with the VS 2022 17.12 std::variant C2665 fix,
  # flutterfire #16840), which forces firebase_core >= 3.10.0; the exact
  # pins stay to keep pub from drifting back to 3.15.x. Lift these after
  # the VS toolset is updated.
  firebase_core: 3.10.0
  firebase_auth: 5.4.0
  firebase_messaging: 15.1.0
  firebase_remote_config: 5.1.3
  firebase_dynamic_links: 6.0.5
  cloud_firestore: 5.4.0
  get_it: ^8.0.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  freezed_annotation: ^2.4.4
  google_fonts: ^6.3.0
  http: ^1.2.0
  sqlite3: 2.9.4
