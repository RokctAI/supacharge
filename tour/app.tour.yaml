# Guided-tour manifest for the Supacharge app shell.
#
# This file is the ONLY place the tour carries Supacharge branding: SDK tour
# fragments (each SDK's templates/tour/<sdk>.tour.yaml) stay brand-neutral
# and receive {app_name}/{app_tagline} by substitution at merge time.
# The merge, capture and assembly all run in CI via
# RokctAI/shared-workflows .github/workflows/universal-guided-tour.yml;
# format documentation lives in that repo at scripts/tour/README.md.
#
# The tour runs three chapters through the same app session - student,
# partner, admin - chained by app-shell sign-out/sign-in steps below. In
# demo builds MockAuthRepository maps partner@demo.rokct.ai to the partner
# role and admin@demo.rokct.ai to the admin role; any other email signs in
# as a student.
#
# Video colours are intentionally NOT declared here: the assembler derives
# brand/accent colours from the composed AppStyle when the manifest carries
# no colour keys, so the video always matches the app's real theme.
#
# Outputs land in marketing/tour/ (screenshots + feature-guide.md required,
# per-chapter videos best-effort).
app:
  name: Supacharge
  tagline: Live tutoring that fits around school
  # Committed app logo (transparent background), shown on the video end card.
  logo: assets/images/logo.png
video:
  hook: "Big test coming? Bring backup."
  offer: "Start learning today."
  # The auth chapter's key content is bottom sheets, so its phone hangs
  # top-cropped from the top canvas edge (keeping the sheet fully
  # visible); every other chapter keeps the default bottom-cropped
  # WhatsApp-ad framing.
  chapter_frame_anchor:
    auth: top
store:
  # Play feature graphic: the hero screenshot is the app's HOME step
  # (demo logins land on /schedule).
  feature_step: schedule
setup:
  imports:
    - "import 'package:base_sdk/src/models/response/languages_response.dart';"
    - "import 'package:base_sdk/src/services/local_storage.dart';"
  dart: |
    // Pre-seed the language so the first-run language picker can never
    // block the tour behind a non-dismissible modal (the backend may
    // advertise several languages). LocalStorage.init() is idempotent -
    // app.main() calls it again.
    await LocalStorage.init();
    if (LocalStorage.getLanguage() == null) {
      await LocalStorage.setLanguageData(LanguageData(
        id: '1',
        title: 'English',
        locale: 'en',
        backward: false,
        isDefault: true,
        active: true,
      ));
      await LocalStorage.setLanguageSelected(true);
      await LocalStorage.setLangLtr(false);
    }
tour:
  # Splash settles onto the sign-in screen (demo builds show the demo hint).
  - step:
      key: welcome
      title: "Welcome to Supacharge"
      caption: "{app_name} is *live tutoring* that fits around school - sign in to get started."
      action: wait
      settle: 12
  # auth_sdk captures the auth screens, then performs the student demo
  # sign-in (action only, no still); the session lands on /schedule.
  - fragment: auth
  # Chapter 1 - student: lms_sdk owns the learning screens and the demo
  # data behind them.
  - fragment: lms
  # --- chaining: student -> partner ------------------------------------
  # End the student session and return to the login screen. LocalStorage
  # .logout() is base_sdk's static session teardown (the same call the
  # app's own sign-out uses).
  - step:
      key: sign_out_student
      title: "Sign out (student)"
      action: dart
      screenshot: false
      settle: 4
      dart: |
        LocalStorage.logout();
        router.replaceNamed('/login');
  # Sign in as the demo partner through the same login flow the auth
  # fragment's demo_sign_in uses; MockAuthRepository maps this email to
  # the partner role. The demo session policy lands on /schedule - the
  # next fragment's first route step navigates from there, so only a
  # modest settle is needed here.
  - step:
      key: partner_sign_in
      title: "Sign in (partner)"
      action: dart
      screenshot: false
      settle: 6
      dart: |
        final Element element = tester.element(find.byType(Navigator).first);
        final ProviderContainer container =
            ProviderScope.containerOf(element, listen: false);
        // loginProvider is autoDispose: hold a subscription so the notifier
        // survives between the field writes and the login call.
        final ProviderSubscription<dynamic> subscription =
            container.listen(loginProvider, (_, __) {});
        try {
          final login = container.read(loginProvider.notifier);
          login.setEmail('partner@demo.rokct.ai');
          login.setPassword('demo-partners-2026');
          // MockAuthRepository accepts any credentials. The timeout guards the
          // post-session FCM sync, which can stall on an emulator - navigation
          // to the demo landing happens before it, so a timeout is harmless.
          await login
              .login(element)
              .timeout(const Duration(seconds: 45), onTimeout: () {});
        } finally {
          subscription.close();
        }
  # Chapter 2 - partner: lms_sdk's partner screens (keys partner_*).
  - fragment: lms_partner
  # --- chaining: partner -> admin --------------------------------------
  - step:
      key: sign_out_partner
      title: "Sign out (partner)"
      action: dart
      screenshot: false
      settle: 4
      dart: |
        LocalStorage.logout();
        router.replaceNamed('/login');
  - step:
      key: admin_sign_in
      title: "Sign in (admin)"
      action: dart
      screenshot: false
      settle: 6
      dart: |
        final Element element = tester.element(find.byType(Navigator).first);
        final ProviderContainer container =
            ProviderScope.containerOf(element, listen: false);
        // loginProvider is autoDispose: hold a subscription so the notifier
        // survives between the field writes and the login call.
        final ProviderSubscription<dynamic> subscription =
            container.listen(loginProvider, (_, __) {});
        try {
          final login = container.read(loginProvider.notifier);
          login.setEmail('admin@demo.rokct.ai');
          login.setPassword('demo-admins-2026');
          // MockAuthRepository accepts any credentials. The timeout guards the
          // post-session FCM sync, which can stall on an emulator - navigation
          // to the demo landing happens before it, so a timeout is harmless.
          await login
              .login(element)
              .timeout(const Duration(seconds: 45), onTimeout: () {});
        } finally {
          subscription.close();
        }
  # Chapter 3 - admin: lms_sdk's admin screens (keys admin_*).
  - fragment: lms_admin
  # Chapter 4 - the wallet: wallet_sdk's top-up screen (/wallet-topup,
  # WalletTopUpRoute, composed here and routed top-level). Amount presets
  # render locally; the saved-card picker degrades gracefully offline. The
  # admin session from the chapter above is a signed-in session like any
  # other for this screen.
  - fragment: wallet
  # Chapter 5 - the day plan: productivity_sdk's /tasks (composed here,
  # routed top-level; local drift database, renders its add-a-task surface
  # with no backend).
  - fragment: productivity
