# Guided-tour fragment for replay_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `replay` (fragment file names must be unique across composed SDKs)
# and documents why there are no steps, so the merge's "SDK has not adopted
# guided tours" warning does not hide a real decision.
#
# replay_sdk is a headless lesson-replay engine (asset bundles, audio sync,
# preload orchestration): manifest.json declares no installs and no routes,
# so there is no screen a tour step could ever capture. Replayed lessons
# render inside the screens of the SDKs that embed the engine (e.g.
# lms_sdk's library), which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: replay
steps: []
