# Guided-tour fragment for lms_sdk.
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns only the screens
# lms_sdk owns - the same SDK whose DemoLmsRepository seeds the demo data
# these screens show in demo builds (--dart-define=IS_DEMO=true).
#
# Routes are the unguarded route paths this SDK declares in manifest.json;
# the tour runner navigates them via context.router.replaceNamed. Screens
# whose routes require parameters (/lesson-session, /subject-board) are
# deliberately not part of the fragment.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: lms
imports:
  - "import 'package:lms_sdk/lms_sdk.dart';"
steps:
  # The demo dataset ships with LAST YEAR's grade on purpose, so the first
  # /schedule visit lands on the new-school-year gate - that screen is the
  # still this step captures.
  - key: grade_prompt
    title: "A new school year"
    caption: "Come back in January and one question sets you up - which grade are you in now?"
    action: route
    route: /schedule
    settle: 8
  # Tap the gate's confirm CTA ("That's me - Grade 12") so the stored demo
  # grade rolls over; every screen after this - subjects, library, practice,
  # profile - renders the NEW grade, and this step captures the schedule
  # itself once the gate clears.
  - key: schedule
    title: "Today, sorted"
    caption: "One tap confirms your new grade - and your day is back at a glance, with the next live session front and centre."
    action: dart
    settle: 8
    screenshot: true
    dart: |
      // The /schedule step above landed on GradeRolloverGate (demo ships
      // last year's grade). Its single FilledButton is the confirm CTA with
      // the suggested new grade preselected. Tolerant: if the gate is not
      // on screen (grade already confirmed this run), there is nothing to
      // tap and the schedule is already showing.
      //
      // The CTA sits at the bottom of the gate's Scaffold. ScheduleRouteView
      // used to paint the floating bottom nav over it, which won the hit
      // test: this tap landed on the nav's Discover slot, the grade was
      // never confirmed, and this step captured the tutor-discovery screen -
      // byte-identical to the later `tutors` still. The nav now folds away
      // while the gate is up (lms_sdk >= 1.16.0), so the tap reaches the
      // button. The check below states that out loud rather than silently
      // capturing the wrong screen if it ever regresses.
      final Finder cta = find.descendant(
        of: find.byType(GradeRolloverGate),
        matching: find.byType(FilledButton),
      );
      if (cta.evaluate().isNotEmpty) {
        await tester.tap(cta.first, warnIfMissed: false);
        // The runner never pumps (the app drives its own frames), so give
        // the confirm its round trip before looking again.
        await Future<void>.delayed(const Duration(seconds: 3));
        if (find.byType(GradeRolloverGate).evaluate().isNotEmpty) {
          throw StateError(
            'grade rollover gate still up after tapping its confirm CTA - '
            'something is covering the button; the schedule was not reached',
          );
        }
      }
  # The screen this step captures is titled "Subjects" (CourseCatalogPage's
  # app bar renders TrKeys.subjects); the step key and route stay `courses`
  # because they name the route, not the label.
  - key: courses
    title: "Built for CAPS and IEB"
    caption: "Browse every subject you take, term by term."
    action: route
    route: /courses
    settle: 8
  - key: tutors
    title: "Meet the tutors"
    caption: "Real tutors teaching live - find the one whose style clicks with you."
    action: route
    route: /tutors
    settle: 8
  - key: library
    title: "The library keeps everything"
    caption: "Rewatch past lessons and dip into knowledge bites whenever you like."
    action: route
    route: /library
    settle: 8
  - key: practice
    title: "Practice makes marks"
    caption: "Sharpen your skills with practice built around your subjects."
    action: route
    route: /practice
    settle: 8
  - key: league
    title: "Climb the league"
    caption: "Earn points as you learn and see how you stack up this week."
    action: route
    route: /league
    settle: 8
  - key: my_plan
    title: "One clear plan"
    caption: "See exactly what your plan includes - no surprises."
    action: route
    route: /my-plan
    settle: 8
  - key: profile
    title: "Your learning, your profile"
    caption: "Your {app_name} profile tracks your grade, subjects and progress in one place."
    action: route
    route: /profile
    settle: 8
