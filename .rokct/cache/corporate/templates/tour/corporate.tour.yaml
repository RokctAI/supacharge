# Guided-tour fragment for corporate_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `corporate` (fragment file names must be unique across composed
# SDKs) and documents why there are no steps, so the merge's "SDK has not
# adopted guided tours" warning does not hide a real decision.
#
# corporate_sdk is a corporate/back-office data layer plus the two legal
# pages (TermPage/PolicyPage). Since 1.2.0 manifest.json routes those at
# /term and /policy (pre-fork paths, via the installed
# templates/routes/corporate_route_pages.dart shell), but they render
# server-supplied legal HTML behind a login footer link - nothing a tour
# step demonstrates. Its data surfaces inside the screens of the SDKs that
# display it, which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: corporate
steps: []
