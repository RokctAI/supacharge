# Guided-tour fragment for productivity_sdk.
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns the screens
# productivity_sdk installs: the tasks planner at /tasks (manifest.json
# routes, TasksRoute — the SDK's own home_page) and a task's guided run at
# /tasks/run (TaskRunRoute).
#
# No demo repository: tasks live in the app's local drift database
# (manifest.json "database" tables), so the screen renders its own
# add-a-task surface on a fresh install and every entry made during the
# tour persists locally without any backend. Every step below therefore
# seeds what it shows itself, written through the same repository the page
# writes: the first step a day's tasks for a Limpopo water business (the
# tenant fiction design strip sections 41 and 44 draw), the service-run
# steps one described plant and one softener service run. The stills carry
# real rows rather than an empty list, and nothing on them says so.
#
# Design strip frame 44a is list AND detail side by side on a wide window
# (the phone fold, 44d, expands the card in place), and frame 47a puts a
# run in that same detail plane, so the steps open what they show from the
# LIST — a tap on the card, a tap on its run pill — rather than routing to
# the workspace at rest.
#
# One rule of the runner every step here lives by: `router.replaceNamed`
# onto the route that is ALREADY on top keeps the page and its state. The
# route's page is keyed by its name (auto_route's AutoRoutePage.canUpdate
# compares routeKey), so replacing /tasks with /tasks is a same-key update
# to the Navigator: no new TasksPage, no new initState, no reload of the
# list, and whatever lane the previous step opened stays open. A step that
# seeds rows and then needs the list to hold them must therefore arrive at
# /tasks from ANOTHER route, or go to another route altogether. The
# service-run steps go to /tasks/run?task=<id>, the route the run pill
# itself pushes at one plane (46f) and which, since 1.5.2, hands a wide
# window to the workspace with that run open in the detail plane (47a) —
# so the still is the one the pill would have opened, on both folds, and
# it is reached from any screen the tour is on.
#
# A second rule, for the steps that type: `tester.enterText` opens the
# device's real keyboard (the integration binding does not register
# flutter_test's fake TestTextInput, so `tester.testTextInput.hide()`
# would assert), and nothing closes it before the frame is held for the
# capture — the tablet audit of 2026-09-07 found the system keyboard over
# the lower fifth to quarter of the readings still on every shell. So a
# step that has typed unfocuses the field and asks the platform to hide
# the keyboard (`TextInput.hide`) before it returns, then gives the sheet
# a moment to re-lay out. The value typed stays in the field: unfocus does
# not clear a controller.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: productivity
imports:
  - "import 'package:base_sdk/src/database/app_database.dart';"
  - "import 'package:flutter/services.dart';"
  - "import 'package:productivity_sdk/src/common/application/run/maintenance_plant.dart';"
  - "import 'package:productivity_sdk/src/common/application/run/maintenance_templates.dart';"
  - "import 'package:productivity_sdk/src/common/application/run/task_run.dart';"
  - "import 'package:productivity_sdk/src/common/infrastructure/repositories/todo_repository_impl.dart';"
  - "import 'package:productivity_sdk/src/common/presentation/run/task_run_view.dart';"
  - "import 'package:productivity_sdk/src/common/presentation/tasks/task_card.dart';"
  - "import 'package:productivity_sdk/src/common/presentation/tasks/productivity_plus_nav.dart';"
steps:
  # 44a on a wide window: the list in one plane, the tapped task's detail
  # beside it; 44d on the phone: the same card expanded in place. The day's
  # tasks are seeded first so the list has rows to show.
  - key: productivity_tasks
    title: "Plan your day in seconds"
    caption: "Capture to-dos with subtasks and categories - *your day, planned* before it starts."
    action: dart
    screenshot: true
    settle: 7
    dart: |
      final DateTime today = DateTime.now();
      DateTime at(int days, int hour) =>
          DateTime(today.year, today.month, today.day + days, hour);
      String ago(int hours) =>
          today.subtract(Duration(hours: hours)).toIso8601String();
      await TodoRepositoryImpl(AppDatabase()).saveTodos(
        <Map<String, dynamic>>[
          <String, dynamic>{
            'id': 'tour-task-depot-01',
            'notifId': 47101,
            'title': 'Deliver 40 × 20 L to the Mokopane depot',
            'isDone': false,
            'deadline': at(1, 9).toIso8601String(),
            'reminder': true,
            'priority': 'High',
            'category': 'Deliveries',
            'recurrence': 'Weekly',
            'createdAt': ago(2),
            'subtasks': <Map<String, dynamic>>[
              <String, dynamic>{'title': 'Load the bakkie', 'isDone': true},
              <String, dynamic>{
                'title': 'Collect the signed delivery note',
                'isDone': false,
              },
              <String, dynamic>{'title': 'Bring back the empties', 'isDone': false},
            ],
          },
          <String, dynamic>{
            'id': 'tour-task-brine-02',
            'notifId': 47102,
            'title': 'Order brine salt · 25 kg bags',
            'isDone': false,
            'deadline': at(2, 10).toIso8601String(),
            'reminder': false,
            'priority': 'Medium',
            'category': 'Plant',
            'recurrence': 'Monthly',
            'createdAt': ago(5),
            'subtasks': <Map<String, dynamic>>[
              <String, dynamic>{'title': 'Count the bags left', 'isDone': true},
              <String, dynamic>{'title': 'Send the order to the co-op', 'isDone': false},
            ],
          },
          <String, dynamic>{
            'id': 'tour-task-invoice-03',
            'notifId': 47103,
            'title': 'Chase the Polokwane Spar invoice',
            'isDone': false,
            'deadline': at(5, 12).toIso8601String(),
            'reminder': true,
            'priority': 'Low',
            'category': 'Admin',
            'recurrence': 'None',
            'createdAt': ago(9),
            'subtasks': <Map<String, dynamic>>[],
          },
          <String, dynamic>{
            'id': 'tour-task-borehole-04',
            'notifId': 47104,
            'title': 'Second borehole · quotes and water-use licence',
            'isDone': false,
            'reminder': false,
            'priority': 'Medium',
            'category': 'Plant',
            'recurrence': 'None',
            'isLongTerm': true,
            'createdAt': ago(30),
            'subtasks': <Map<String, dynamic>>[
              <String, dynamic>{'title': 'Three drilling quotes', 'isDone': true},
              <String, dynamic>{'title': 'Water-use licence application', 'isDone': false},
              <String, dynamic>{'title': 'Pump and tank sizing', 'isDone': false},
            ],
          },
        ],
      );
      router.replaceNamed('/tasks');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Finder card = find.byKey(
        const ValueKey<String>('task-card-tour-task-depot-01'),
      );
      if (card.evaluate().isNotEmpty) {
        await tester.tap(card.first, warnIfMissed: false);
      }
  # Design strip section 47 (47a / 47d): the compose lane's "From
  # template" row. The plant is described first (47d's gate), so the
  # service templates are live; the softener one is picked so the still
  # shows the form filled with its eleven steps.
  - key: productivity_task_compose
    title: "A service run from a template"
    caption: "Softener, megaChar, filters and membranes - *one tap fills the task* with every step and its timing."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      await MaintenancePlantStore.local.save(
        PlantRecord(
          megaCharVessels: 1,
          softenerVessels: 1,
          vesselsInstalledOn: DateTime(2026, 3, 14),
          preFilterInstalledOn: DateTime(2026, 8, 20),
          roFilterInstalledOn: DateTime(2026, 6, 1),
          postFilterInstalledOn: DateTime(2026, 6, 1),
          membranes: 2,
          membranesInstalledOn: DateTime(2026, 1, 10),
          recordedAt: DateTime.now(),
        ),
      );
      router.replaceNamed('/tasks');
      await Future<void>.delayed(const Duration(seconds: 3));
      // The plus moved onto the floating nav (Ray, 2026-09-20: "i think
      // productivity plus should be in the floating nav when you in its
      // page"), so the tap that opens the compose lane is the bar's own
      // control rather than a FloatingActionButton keyed by list.
      final Finder compose = find.descendant(
        of: find.byKey(ProductivityPlusNav.navKey),
        matching: find.byIcon(ProductivityPlusNav.plusIcon),
      );
      if (compose.evaluate().isNotEmpty) {
        await tester.tap(compose.first, warnIfMissed: false);
        await Future<void>.delayed(const Duration(seconds: 2));
      }
      final Finder softener = find.byKey(
        const ValueKey<String>('template-softener_maintenance'),
      );
      if (softener.evaluate().isNotEmpty) {
        await tester.tap(softener.first, warnIfMissed: false);
      }
  # 47a / 47b / 47h: a softener service already through its nine stages,
  # opened at its readings step with the permeate TDS out of spec, so the
  # still carries the amber block and its wording. Opened by the run's own
  # route, /tasks/run?task=<id> — 44a's detail plane beside the list on a
  # wide window (47a — "no new plane"), the pushed /tasks/run page on the
  # phone (46f) — because the previous step left the tour ON /tasks with
  # the compose lane open, and re-routing to /tasks keeps that page as it
  # stands (see the note at the top): the seeded card would never be in
  # the list, its run pill never found, and the still would be the compose
  # lane again. Every wait below is for the widget the next tap needs,
  # bounded, rather than a fixed pause.
  - key: productivity_maintenance_readings
    title: "Readings before it goes back to service"
    caption: "TDS and pressure against the plant's limits - *out of spec is named* and holds the finish until re-tested or explained."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      Future<bool> appears(Finder finder, {int seconds = 10}) async {
        final DateTime deadline =
            DateTime.now().add(Duration(seconds: seconds));
        while (finder.evaluate().isEmpty &&
            DateTime.now().isBefore(deadline)) {
          await Future<void>.delayed(const Duration(milliseconds: 250));
        }
        return finder.evaluate().isNotEmpty;
      }
      final DateTime now = DateTime.now();
      final Map<String, dynamic> task = MaintenanceTemplates.build(
        MaintenanceTemplate.softenerMaintenance,
        now: now,
      );
      task['id'] = 'tour-softener-sft-02';
      task['notifId'] = 47021;
      task['title'] = 'Softener SFT-02 · Polokwane plant';
      task['category'] = 'Plant';
      task['createdAt'] = now.toIso8601String();
      TaskRun run = TaskRun.fromTask(task);
      DateTime at = now.subtract(const Duration(hours: 1, minutes: 5));
      for (int i = 0; i < 9; i++) {
        run = run.start(i, at);
        at = at.add(Duration(seconds: run.steps[i].durationSeconds));
        run = run.complete(i, at);
      }
      await TodoRepositoryImpl(AppDatabase()).saveTodos(
        <Map<String, dynamic>>[run.applyTo(task)],
      );
      router.replaceNamed('/tasks/run?task=tour-softener-sft-02');
      // 860: a run found mid-way opens on its resume card. Pick it up.
      final Finder resume = find.byKey(TaskRunView.resumeKey);
      if (await appears(resume)) {
        await tester.tap(resume.first, warnIfMissed: false);
        await tester.pump();
      }
      // 47h: the four readings, the permeate TDS (212 ppm against a 50 ppm
      // limit) out of spec so the amber block and its wording are drawn.
      const List<String> readings = <String>['175', '212', '8.4', '1.9'];
      if (await appears(find.byKey(TaskRunView.readingKey(0)))) {
        for (int i = 0; i < readings.length; i++) {
          final Finder field = find.byKey(TaskRunView.readingKey(i));
          if (field.evaluate().isNotEmpty) {
            await tester.enterText(field.first, readings[i]);
            await tester.pump();
          }
        }
      }
      // The last enterText left the device keyboard up over the foot of
      // the sheet (see the note at the top). Drop focus, tell the platform
      // to hide it, and let the sheet re-lay out before the frame is held.
      FocusManager.instance.primaryFocus?.unfocus();
      await tester.pump();
      await SystemChannels.textInput.invokeMethod<void>('TextInput.hide');
      await tester.pump();
      await Future<void>.delayed(const Duration(milliseconds: 750));
  - key: productivity_maintenance_photo
    title: "A photo and a note, if you want them"
    caption: "The last step is optional - *Skip is live* beside Finish, and nothing here can trap you mid-run."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      Future<bool> appears(Finder finder, {int seconds = 10}) async {
        final DateTime deadline =
            DateTime.now().add(Duration(seconds: seconds));
        while (finder.evaluate().isEmpty &&
            DateTime.now().isBefore(deadline)) {
          await Future<void>.delayed(const Duration(milliseconds: 250));
        }
        return finder.evaluate().isNotEmpty;
      }
      // 47h's route out, taken: the permeate re-tested in spec. The view
      // hands the reading straight back through onChanged, so Continue
      // is live on the next frame.
      final Finder permeate = find.byKey(TaskRunView.readingKey(1));
      if (permeate.evaluate().isNotEmpty) {
        await tester.enterText(permeate.first, '40');
        await tester.pump();
        await Future<void>.delayed(const Duration(milliseconds: 500));
      }
      final Finder forward = find.byKey(TaskRunView.continueKey);
      if (forward.evaluate().isNotEmpty) {
        await tester.tap(forward.first, warnIfMissed: false);
        await tester.pump();
      }
      // 47i: the readings step finished, the photo step's own slot is on
      // screen — the still is this card, never the readings card again.
      await appears(find.byKey(TaskRunView.photoKey));
      // This step typed too; make sure the keyboard is gone before the
      // photo card is captured (note at the top).
      FocusManager.instance.primaryFocus?.unfocus();
      await tester.pump();
      await SystemChannels.textInput.invokeMethod<void>('TextInput.hide');
      await tester.pump();
      await Future<void>.delayed(const Duration(milliseconds: 750));
