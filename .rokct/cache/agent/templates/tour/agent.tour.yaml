# Guided-tour fragment for agent_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `agent` (fragment file names must be unique across composed SDKs)
# and documents why there are no steps yet, so the merge's "SDK has not
# adopted guided tours" warning does not hide a real decision.
#
# agent_sdk's one routed screen cannot be toured today:
#   - Its /assistant-chat route (AssistantChatRoute) requires a constructor
#     argument (`required AssistantService assistantService`), so the tour
#     runner cannot navigate to it via router.replaceNamed (promotions
#     StoryListPage precedent).
#   - The page itself is an installed template
#     (templates/pages/agent/assistant_chat_page.dart -> the host's
#     lib/presentation/pages/agent/), so a fragment cannot push it directly
#     either: the import path is host-package-specific, and fragment
#     imports carry no {package} substitution.
#
# Follow-ups before steps can land here (rule #59):
#   - give the route a parameter-less view that resolves AssistantService
#     from DI (the ForexAccountRouteView pattern), or
#   - move the page into lib/ so a fragment can push it by SDK import
#     (the marketplace fragment pattern).
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: agent
steps: []
