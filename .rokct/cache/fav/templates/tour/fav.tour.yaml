# Guided-tour fragment for fav_sdk.
#
# Registered EMPTY on purpose - this file claims the fleet-registry fragment
# name `fav` (fragment file names must be unique across composed SDKs) and
# documents why there are no steps, so the merge's "SDK has not adopted
# guided tours" warning does not hide a real decision.
#
# fav_sdk is a headless favourites data layer: manifest.json declares no
# installs and no routes, so there is no screen a tour step could ever
# capture. Favourites surface inside the screens of the SDKs that display
# them (e.g. the customer favourites list), which own their own fragments.
#
# Brand-neutral by rule; format: RokctAI/shared-workflows
# scripts/tour/README.md
sdk: fav
steps: []
