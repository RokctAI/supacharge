# Guided-tour fragment for merchants_sdk (manager role).
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns only the screens
# merchants_sdk itself installs for app_type=manager composes: the manager
# home shell (/main, manifest.json app_type.manager) and the sync-issues
# screen (/sync-issues). Include it only in manager-family app manifests
# (paas_manager, pos, launch_manager) - those routes do not exist in other
# composes.
#
# Demo grounding (--dart-define=IS_DEMO=true): merchants_di.dart swaps in
# MockShopsRepository for the customer-facing ShopsRepositoryFacade, and
# since 1.22.0 ManagerMerchantsDependencies demo-gates the manager-side
# SellerShopRepositoryFacade to this SDK's own DemoSellerShopRepository -
# which serves MockShopsRepository.demoShop itself, so the shop a demo
# customer browses and the shop a demo manager runs are ONE shop. That is
# what makes the restaurant_hub step below a real capture rather than a
# blank header. The driver-role story screen (/story, app_type.driver) is
# out of scope - it belongs in a future driver-role fragment, since this
# fragment's /main route does not exist in driver composes.
#
# The sync-issues screen renders truthfully in demo: nothing is parked, so
# its own empty state ("no data") is the correct all-synced picture.
#
# POS steps (1.12.0, tour-sync rule: screen + fragment ship in the same
# PR): the till (BillingPage, tab 0) and the /pos-checkout flow ARE
# demo-grounded - ManagerMerchantsDependencies demo-gates the POS product
# lookup to this SDK's MockProductsRepository ("Flame-grilled beef burger", R150.00),
# and the checkout's connectivity probe fails closed to the offline-code
# flow in a headless harness - so every POS still below renders real
# widgets over real demo data with zero backend contact. The camera never
# mounts in demo builds; the viewfinder stage renders its camera-less
# stand-in (the approved strip's own render harness did the same).
#
# Checkout step (1.30.0): the SAME steps run on the phone leg and the
# tablet leg (shared-workflows README "The tablet leg"), and the two legs
# reach the checkout differently by design. A phone pushes the
# /pos-checkout route (frame 11c). At plane widths the till NEVER pushes
# that route: Continue (287) opens the checkout INSIDE the till's
# PlaneHost - the approved 11n spread (checkout claims two, the till keeps
# its scan plane with the live slip 322, the host's END-corner back pill)
# - and the route would only stretch the phone column over the planes
# (tablet audit 2026-09-07, defect 2). So pos_checkout is a dart step that
# decides the way BillingPage._openCheckout decides: the plane count at
# Continue - a tap on Continue where planes host it, the route elsewhere.
#
# Receipt steps (1.29.0, same tour-sync rule): "Print Receipt & Finish"
# (293) on the checkout lands on the receipt preview first (approved
# frame 11k) - the paper slip drawn from the cart, with the checkout's own
# dual finish beneath it. On the phone route (CheckoutPage.onReceipt is
# null there) the checkout pushes the preview above itself as a plain
# route; on the till-hosted checkout 293 hands the receipt to the till,
# which pops the checkout and gives the preview ONE plane at the END with
# the till back beneath (frame 11r) - so the tablet leg captures 11r
# through the same step. pos_receipt_preview captures that page; the
# action-only pos_receipt_finish step then records the sale from it.
# Printing in a headless run is PosReceiptPrinter's default no-op (no
# hardware handler is installed), and the demo-registered PosOrdersFacade
# records the sale in memory - never the sync queue - so the sale
# completes with zero backend contact and nothing is parked for the
# sync_issues still.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: merchants
imports:
  - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
  - "import 'package:merchants_sdk/src/manager/application/main/main_provider.dart';"
  - "import 'package:merchants_sdk/src/manager/application/pos_cart/pos_cart_provider.dart';"
  - "import 'package:base_sdk/src/presentation/adaptive/planes.dart';"
  - "import 'package:base_sdk/src/services/app_helpers.dart';"
  - "import 'package:base_sdk/src/services/tr_keys.dart';"
steps:
  # Arrival/warm-up step: land the manager home shell (bottom navigation;
  # POS till preloaded on tab 0, the order queue on tab 1). No still is
  # captured here - the POS tab gets its own pos_scan still next, and the
  # queue tab's content is orders_sdk's to tour (see orders.tour.yaml).
  - key: manager_home
    title: "Open the manager home"
    action: route
    route: /main
    settle: 10
    screenshot: false
  - key: pos_scan
    title: "Sell straight from the camera"
    caption: "The till is the first thing a store owner sees - point it at any barcode and *every scan* lands the product in the cart, with torch and battery-saving auto-pause built in."
    action: dart
    settle: 8
    dart: |
      // Select the POS tab (index 0) explicitly - an earlier fragment may
      // have left another tab selected, and mainProvider's selection
      // persists across routes.
      router.replaceNamed('/main');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      container.read(mainProvider.notifier).selectIndex(0);
  - key: pos_cart
    title: "The cart keeps up"
    caption: "Steppers, decimal weights for loose goods, *live formatted totals* - and Clear All for when the customer changes their mind."
    action: dart
    settle: 6
    dart: |
      // Demo build: the barcode lane resolves through this SDK's
      // MockProductsRepository ("Flame-grilled beef burger", R150.00), zero backend
      // contact - the same path a real scan takes.
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      await container
          .read(posCartProvider.notifier)
          .addByBarcode('6001067890123');
      container.read(posCartProvider.notifier).increment(0);
  - key: pos_checkout
    title: "Cash, QR - or offline by code"
    caption: "Take cash or a pay-link QR the customer scans on their own phone; offline, *a 6-digit code* confirms it and the sale syncs itself later."
    action: dart
    settle: 8
    dart: |
      // Continue (287, Key posContinue) sits at the foot of the cart -
      // the whole phone column, the cart plane at plane widths. Where the
      // till's PlaneHost grants more than one plane, Continue is the ONLY
      // way into the approved 11n checkout (it opens inside the planes;
      // BillingPage._openCheckout never pushes the route there), so the
      // branch reads the same plane count that method reads, from the
      // button's own context. One plane is the phone: the /pos-checkout
      // route, exactly the step this replaces.
      final Finder continueButton = find.byKey(const Key('posContinue'));
      final bool hostedInPlanes = continueButton.evaluate().isNotEmpty &&
          (Planes.maybeOf(tester.element(continueButton))?.count ?? 1) > 1;
      if (hostedInPlanes) {
        await tester.tap(continueButton, warnIfMissed: false);
      } else {
        router.replaceNamed('/pos-checkout');
      }
  - key: pos_receipt_preview
    title: "See the receipt before it prints"
    caption: "*Print Receipt & Finish* lands on the paper first - the slip exactly as it will print, line by line - so a receipt never fires blind, and one tap finishes the sale from there."
    action: dart
    settle: 6
    dart: |
      // 293 on the checkout (merchants_sdk 1.29.0, frame 11k) opens the
      // receipt preview - the paper slip with the checkout's own dual
      // finish beneath it - pushed above /pos-checkout as a plain route
      // on the phone, handed to the till as the one-plane receipt (11r)
      // where the checkout is plane-hosted (see the pos_checkout step).
      // The button sits at the foot of the checkout's vertical scroll
      // column (one on a phone, the tender column on the planes spread),
      // and the sliver only builds it once it is in view, so every
      // vertical scrollable is run to its end first. The button carries
      // no widget key - its label is the tr_key the page itself renders.
      final Finder scrollables = find.byType(Scrollable);
      for (int i = 0; i < scrollables.evaluate().length; i++) {
        final ScrollableState scrollable =
            tester.state<ScrollableState>(scrollables.at(i));
        if (scrollable.position.axis != Axis.vertical) continue;
        scrollable.position.jumpTo(scrollable.position.maxScrollExtent);
      }
      await Future<void>.delayed(const Duration(seconds: 1));
      await tester.tap(
        find.text(AppHelpers.getTranslation(TrKeys.printReceipt)).first,
        warnIfMissed: false,
      );
  # Action-only step: finish the sale from the preview so the next steps
  # start from an unobstructed home shell with an empty till. No still is
  # captured here.
  - key: pos_receipt_finish
    title: "Print it and finish"
    action: dart
    settle: 4
    screenshot: false
    dart: |
      // "Print Receipt & Finish" (293) on the preview: print THEN record,
      // the checkout's own PosSaleFinish pipeline. Headless there is no
      // printer installed, so PosReceiptPrinter's default handler is a
      // no-op and the finish records through the demo PosOrdersFacade (in
      // memory, never the sync queue). A composed shell that installs a
      // hardware printer would fail the print here and leave the preview
      // up with the sale open - "Finish without Receipt" (294) then
      // records it, so the tour continues either way. On success the
      // preview pops and the checkout leaves with it, back to /main - on
      // the planes the receipt plane closes and the till spreads again.
      await tester.tap(
        find.byKey(const Key('posReceiptPrintFinish')),
        warnIfMissed: false,
      );
      await Future<void>.delayed(const Duration(seconds: 3));
      final Finder finishWithout =
          find.byKey(const Key('posReceiptFinishWithout'));
      if (finishWithout.evaluate().isNotEmpty) {
        await tester.tap(finishWithout, warnIfMissed: false);
      }
  - key: restaurant_hub
    title: "Everything else, one tap away"
    caption: "The *restaurant hub* is the spine of the app - your shop's identity up top, and every setting, section and report a tap below it."
    action: dart
    settle: 8
    dart: |
      // Land the manager home shell and select the restaurant tab (index 4
      // since merchants_sdk 1.14.0 - POS till 0, order queue 1, kitchen 2,
      // foods 3) through the shell's own mainProvider, the same state the
      // bottom-navigation buttons drive. Route first: an earlier fragment
      // may have left the app elsewhere, and mainProvider's selection
      // persists across routes.
      //
      // The tab is preload: false in the shell's IndexedStack, so selecting
      // it is what first builds RestaurantPage - whose initState fetches
      // the shop through SellerShopRepositoryFacade. In demo builds that is
      // this SDK's DemoSellerShopRepository (see the demo-grounding note at
      // the top of this file), so the header renders with the demo shop's
      // name and rating rather than empty; the rows below it carry their
      // own isDemo subtitles. The settle covers that first fetch.
      router.replaceNamed('/main');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      container.read(mainProvider.notifier).selectIndex(4);
  - key: sync_issues
    title: "Nothing gets lost offline"
    caption: "Sell through any outage - offline work syncs back by itself, and anything that snags waits here with *retry or discard*."
    action: route
    route: /sync-issues
    settle: 6
